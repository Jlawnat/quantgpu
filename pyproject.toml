[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantgpu"
dynamic = ["version"]
description = "High-performance quantitative finance research engine for CPU/GPU benchmarking and numerical validation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Elliot Young" }
]

dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.dynamic]
version = { attr = "quantgpu.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests across multiple QuantGPU components or backends",
    "numerical: statistical and numerical correctness tests",
    "gpu: tests requiring an NVIDIA CUDA-capable GPU",
    "slow: tests intentionally excluded from the fast development loop",
]

[tool.coverage.run]
branch = true
source = ["quantgpu"]
omit = [
    "src/quantgpu/backends/torch_cuda.py",
    "src/quantgpu/backends/torch_cuda_fused.py",
    "src/quantgpu/backends/torch_cuda_compiled.py",
    "src/quantgpu/backends/triton_cuda.py",
    "src/quantgpu/benchmarking/cuda_timer.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
[[tool.mypy.overrides]]
module = ["quantgpu.backends.triton_cuda"]
disable_error_code = [
    "import-not-found",
    "import-untyped",
    "untyped-decorator",
    "no-untyped-def",
]
